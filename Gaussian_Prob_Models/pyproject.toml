[project]
name = "gaussian-prob-models"
version = "0.1.0"
description = "Linear and Quadratic Discriminant Analysis from scratch (NumPy/SciPy)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sahil Murmu", email = "msahil2603@gmail.com" }
]
keywords = ["lda", "qda", "gaussian", "discriminant-analysis", "from-scratch"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
gaussian-prob-models = "gaussian_prob_models:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
